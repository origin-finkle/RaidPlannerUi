<div class="text-white">
  <h1 class="text-2xl font-bold mb-4">🎧 Raideurs avec pseudo IHM</h1>
  <table class="w-full text-left border border-gray-600">
    <thead class="bg-gray-800 text-gray-300">
    <tr>
      <th class="p-2">Pseudo Discord</th>
      <th class="p-2">Pseudo IHM</th>
      <th class="p-2">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let joueur of joueurs" class="border-t border-gray-600">
      <td class="p-2">{{ joueur.serverPseudo }}</td>
      <td class="p-2">
        <input type="text" [value]="joueur.pseudoIhm" (change)="onPseudoChange($event, joueur)"
               class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-white" />
      </td>
      <td class="p-2 space-x-2">
        <button (click)="onEditPlayer(joueur)" class="text-yellow-300 hover:underline">✏️ Modifier</button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Nouvelle modale moderne -->
  <div *ngIf="joueurEnCours" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-start z-50 pt-20">
    <div class="bg-gray-900 text-white rounded-xl shadow-xl w-full max-w-2xl p-6 overflow-y-auto max-h-[90vh] relative">
      <!-- Header -->
      <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
        <h2 class="text-2xl font-bold">🛠 Modifier les personnages</h2>
        <button (click)="fermerDialog()" class="text-gray-400 hover:text-red-400 text-lg font-bold">&times;</button>
      </div>

      <p class="mb-4 text-sm text-gray-300">
        Pour <strong>{{ joueurEnCours.pseudoIhm }}</strong>
      </p>

      <!-- Formulaire ajout -->
      <div class="bg-gray-800 p-4 rounded-lg border border-dashed border-gray-600 mb-6">
        <h3 class="text-lg font-semibold mb-3">➕ Nouveau personnage</h3>

        <div class="flex flex-col md:flex-row md:items-center gap-2">
          <label class="text-sm w-24">Nom</label>
          <input [(ngModel)]="nouveauPersonnage.nom" class="bg-gray-600 text-white p-1 rounded w-full md:w-64" />
        </div>

        <div class="flex flex-col md:flex-row md:items-center gap-2 mt-2">
          <label class="text-sm w-24">Classe</label>
          <select [(ngModel)]="nouveauPersonnage.classe" (change)="onClasseChange(nouveauPersonnage)"
                  class="bg-gray-600 text-white p-1 rounded w-full md:w-64">
            <option *ngFor="let classe of classes" [value]="classe">{{ classe }}</option>
          </select>
        </div>

        <div class="flex flex-col md:flex-row md:items-center gap-2 mt-2">
          <label class="text-sm w-24">Spécialisation</label>
          <select [(ngModel)]="nouveauPersonnage.specialisation" class="bg-gray-600 text-white p-1 rounded w-full md:w-64">
            <option *ngFor="let spec of getSpecialisationsPourClasse(nouveauPersonnage.classe) || []" [value]="spec">
              {{ spec }}
            </option>
          </select>
        </div>

        <div class="flex flex-col md:flex-row md:items-center gap-2 mt-2">
          <label class="text-sm w-24">Rôle</label>
          <select [(ngModel)]="nouveauPersonnage.role" class="bg-gray-600 text-white p-1 rounded w-full md:w-64">
            <option value="Tank">Tank</option>
            <option value="Heal">Heal</option>
            <option value="DPS">DPS</option>
          </select>
        </div>

        <div class="flex items-center mt-2">
          <label class="text-sm mr-2">Main ?</label>
          <input type="checkbox" [(ngModel)]="nouveauPersonnage.main" />
        </div>

        <div class="mt-4 text-right">
          <button (click)="ajouterPersonnage()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-1 rounded">
            ✅ Ajouter
          </button>
        </div>
      </div>

      <!-- Liste des personnages existants -->
      <div *ngFor="let perso of personnagesDuJoueur" class="bg-gray-800 p-4 rounded-lg mb-4">
        <div class="flex flex-col md:flex-row md:items-center gap-2">
          <label class="text-sm w-24">Nom</label>
          <input [(ngModel)]="perso.nom" class="bg-gray-700 text-white p-1 rounded w-full md:w-64" />
          <span *ngIf="perso.main" class="ml-2 px-2 py-0.5 text-xs bg-yellow-400 text-black rounded">MAIN</span>
        </div>

        <div class="flex flex-col md:flex-row md:items-center gap-2 mt-2">
          <label class="text-sm w-24">Classe</label>
          <select [(ngModel)]="perso.classe" (change)="onClasseChange(perso)"
                  class="bg-gray-700 text-white p-1 rounded w-full md:w-64">
            <option *ngFor="let classe of classes" [value]="classe">{{ classe }}</option>
          </select>
        </div>

        <div class="flex flex-col md:flex-row md:items-center gap-2 mt-2">
          <label class="text-sm w-24">Spécialisation</label>
          <select [(ngModel)]="perso.specialisation" class="bg-gray-700 text-white p-1 rounded w-full md:w-64">
            <option *ngFor="let spec of getSpecialisationsPourClasse(perso.classe) || []" [value]="spec">
              {{ spec }}
            </option>
          </select>
        </div>


        <div class="flex flex-col md:flex-row md:items-center gap-2 mt-2">
          <label class="text-sm w-24">Rôle</label>
          <select [(ngModel)]="perso.role" class="bg-gray-700 text-white p-1 rounded w-full md:w-64">
            <option value="Tank">Tank</option>
            <option value="Heal">Heal</option>
            <option value="DPS">DPS</option>
          </select>
        </div>

        <div class="mt-4 text-right">
          <button (click)="enregistrerPersonnage(perso)"
                  class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded">
            📏 Enregistrer
          </button>

        </div>
        <div class="mt-4 text-right">
          <button (click)="supprimerPersonnage(perso)"
                  class="bg-red-600 hover:bg-red-700 text-white px-4 py-1 rounded">
            🗑 Supprimer
          </button>
        </div>
      </div>

      <!-- Footer -->
      <div class="mt-6 flex justify-end gap-2 border-t border-gray-700 pt-4">
        <button class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded" (click)="fermerDialog()">Fermer</button>
      </div>
    </div>
  </div>
</div>
