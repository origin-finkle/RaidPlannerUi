<div class="app-shell">
  <div class="app-shell__glow app-shell__glow--left"></div>
  <div class="app-shell__glow app-shell__glow--right"></div>

  <header class="topbar">
    <a class="brand" routerLink="/raids">
      <span class="brand__crest">
        <img class="brand__logo" src="assets/branding/origin-logo.png" alt="Logo Origin">
      </span>
      <span class="brand__copy">
        <span class="brand__title">WoW Raid Planner</span>
        <span class="brand__subtitle">Planning de roster moderne pour les soirs de raid</span>
      </span>
    </a>

    <nav class="topbar__nav" aria-label="Navigation principale">
      <a routerLink="/raids" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-pill">
        Raids
      </a>
      <a routerLink="/admin" routerLinkActive="is-active" class="nav-pill">
        Administration
      </a>
      <button
        *ngIf="authStatus?.authenticated"
        type="button"
        class="nav-pill nav-pill--ghost"
        (click)="logout()"
      >
        {{ authStatus?.displayName || authStatus?.username }} · Deconnexion
      </button>
    </nav>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer" aria-label="Informations de l'application">
    <div class="app-footer__brand">
      <img class="app-footer__logo" src="assets/branding/origin-logo.png" alt="Logo Origin">
      <div class="app-footer__copy">
        <span class="app-footer__title">Origin Raid Planner</span>
        <span class="app-footer__subtitle">Roster, confirmations Discord et compositions pour MoP Classic.</span>
      </div>
    </div>

    <div class="app-footer__meta">
      <span class="footer-pill">Version {{ appVersion }}</span>
      <span class="footer-pill">Auteur {{ author }}</span>
      <span class="footer-pill">Reset {{ resetWindow }}</span>
      <span class="footer-pill">Fuseau {{ timezone }}</span>
    </div>
  </footer>
</div>
